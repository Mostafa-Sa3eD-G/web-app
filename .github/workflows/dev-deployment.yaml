name: Dev Deployment
on:
  push:
    branches:
      - main

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: login to docker hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Get short commit tag
          run: echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_ENV

        - name: Docker build and push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: |
              ${{ vars.DOCKER_USERNAME }}/web-app:latest
              ${{ vars.DOCKER_USERNAME }}/web-app:${{ env.short_tag }}
  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    steps:
        - name: setup ssh
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 400 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ vars.EC2_HOST }} >> ~/.ssh/known_hosts
            
        - name: Get short commit tag
          run: echo "short_tag=${GITHUB_SHA::7}" >> $GITHUB_ENV
        
        - name: Deploy to EC2
          run: |
            ssh -i ~/.ssh/id_rsa ${{ vars.EC2_USER }}@${{ vars.EC2_HOST }} << EOF
              cd /home/ubuntu/web-app
              export IMAGE_TAG=${{ env.short_tag }}
              echo ${IMAGE_TAG}
              docker compose pull
              docker compose up -d
            EOF

          